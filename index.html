  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Log errors to the console only — no visitor-facing overlay. Stays on
  // window (not the DOM) so it survives the replaceWith document swap.
  window.addEventListener('error', function(e) {
    console.error('[bundle]', (e.message || e.type),
      (e.filename ? '(' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : ''));
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"651011bc-c5e6-4186-ac82-680b5dec7e61\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n    body { margin: 0; }\n    ::selection { background: #1fa9dc; color: #06182f; }\n    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }\n    @media (pointer: coarse), (max-width: 820px) { .drag-hint { display: none !important; } }\n  <\u002Fstyle>\n  \n  \n  <script type=\"module\" src=\"16ee7e28-63c2-455e-b1a2-cb62d9f34f2f\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"background:linear-gradient(180deg,#0b1d40 0%,#0a1838 100%); color:#e9f0fb; font-family:'Libre Franklin',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;\">\n\n  <!-- NAV -->\n  <nav style=\"position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:22px 40px; pointer-events:none;\">\n    <a href=\"#top\" style=\"display:flex; align-items:center; gap:12px; text-decoration:none; color:#e9f0fb; pointer-events:auto;\">\n      <span style=\"display:grid; place-items:center; width:36px; height:36px; background:#1fa9dc; color:#06182f; border-radius:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.5px;\">JG<\u002Fspan>\n      <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; letter-spacing:-0.01em;\">Jose&nbsp;Gayondato<\u002Fspan>\n    <\u002Fa>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <header id=\"top\" data-screen-label=\"Hero\" style=\"position:relative; min-height:100vh; overflow:hidden;\">\n    <div style=\"position:absolute; inset:0; z-index:0; pointer-events:none; background:radial-gradient(circle at 50% 42%, rgba(31,169,220,0.22), rgba(31,169,220,0) 52%), radial-gradient(circle at 50% 82%, rgba(236,44,123,0.10), rgba(236,44,123,0) 48%);\"><\u002Fdiv>\n    <lanyard-badge image=\"uploads/my_profile.PNG\" strap-color=\"{{ strapColor }}\" card-color=\"{{ cardColor }}\" clip-color=\"{{ clipColor }}\" style=\"position:absolute; top:0; left:0; width:130%; height:100%; z-index:1; display:block;\"><\u002Flanyard-badge>\n    <div style=\"position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; padding:0 40px; pointer-events:none;\">\n    <div style=\"max-width:620px; padding:120px 0 60px;\">\n      <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:30px;\">\n        <span style=\"width:32px; height:2px; background:#1fa9dc;\"><\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#8ea3c6;\">AI Adoption Lead · 10+ Years<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(44px,5.4vw,82px); line-height:0.98; letter-spacing:-0.03em; margin:0 0 30px; color:#f1f6fd; text-shadow:0 0 1px rgba(5,15,38,0.9), 0 2px 18px rgba(5,15,38,0.72), 0 1px 3px rgba(5,15,38,0.9);\">\n        Part-time explorer,<br>\n        part-time researcher,<br>\n        <span style=\"color:#1fa9dc;\">full-time implementer.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size:18px; line-height:1.6; color:#aebdd8; max-width:480px; margin:0 0 40px; text-wrap:pretty; text-shadow:0 0 1px rgba(5,15,38,0.9), 0 1px 12px rgba(5,15,38,0.8);\">\n        I'm Jose — a technical lead who turns complex enterprise requirements into shipped Java solutions, and now helps teams adopt AI in how they design and build.\n      <\u002Fp>\n    <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"drag-hint\" style=\"position:absolute; left:50%; bottom:40px; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#6f86ac; pointer-events:none; animation:floaty 3s ease-in-out infinite;\">\n      <span>↕<\u002Fspan> Drag the badge\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ABOUT -->\n  <section id=\"about\" data-screen-label=\"About\" style=\"position:relative; z-index:4; padding:120px 40px; border-top:1px solid rgba(255,255,255,0.08); background:#0a1838;\">\n    <div style=\"max-width:1180px; margin:0 auto; display:grid; grid-template-columns:0.8fr 1.2fr; gap:80px;\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#6f86ac; margin-bottom:24px;\">01 — ABOUT<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(30px,3vw,42px); line-height:1.05; letter-spacing:-0.02em; margin:0; color:#f1f6fd;\">A technical lead who ships.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"max-width:620px;\">\n        <p style=\"font-size:18px; line-height:1.7; color:#b3c1db; margin:0 0 22px; text-wrap:pretty;\">I specialize in Java applications. Over the past five years I've overseen multiple projects and led teams to delivery — owning task assignment, framework adoption, code quality, and stakeholder expectations.<\u002Fp>\n        <p style=\"font-size:18px; line-height:1.7; color:#b3c1db; margin:0 0 22px; text-wrap:pretty;\">I plan work around real client business requirements and put the right people on the right problems, delivering solutions for genuinely complex needs.<\u002Fp>\n        <p style=\"font-size:18px; line-height:1.7; color:#b3c1db; margin:0 0 40px; text-wrap:pretty;\">Beyond leading, I'm a hands-on developer with ten years building high-performance enterprise applications, web platforms, and data integrations across systems — so I can propose the right technology for the problem in front of us, not just the familiar one.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:24px; border-top:1px solid rgba(255,255,255,0.12); padding-top:32px;\">\n          <div>\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.02em; color:#f1f6fd;\">10+<\u002Fdiv>\n            <div style=\"font-size:13px; color:#8ea3c6; margin-top:4px; line-height:1.4;\">Years building<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.02em; color:#f1f6fd;\">5<\u002Fdiv>\n            <div style=\"font-size:13px; color:#8ea3c6; margin-top:4px; line-height:1.4;\">Years leading teams<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.02em; color:#1fa9dc;\">Java<\u002Fdiv>\n            <div style=\"font-size:13px; color:#8ea3c6; margin-top:4px; line-height:1.4;\">Enterprise specialist<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.02em; color:#f1f6fd;\">AI<\u002Fdiv>\n            <div style=\"font-size:13px; color:#8ea3c6; margin-top:4px; line-height:1.4;\">Adoption focus<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;strapColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#141558&quot;,&quot;tsType&q
